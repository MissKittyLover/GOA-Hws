<!-- კომენტარების სახით ახსენით თუ რაში შეგვიძლია form - ების გამოყენება

Formების გამოყენება შეგვიძლია მომხმარებლისგან მონაცემების შესაგროვლებლად (Name, Email, password, address, etc.).

-->

<!-- შექმენით input საიდანაც მომხმარებელს შემოატანინებთ თავის სახელს და გვარს ან რაიმე ტექტსურ მონაცემს, გატესტეთ type attribute - ი ჩასვით სხვადასხვა მნიშვნელობები როგორიცაა (password, email, text, month) -->

<!DOCTYPE html>
<html lang = 'en'></html>
<head>
    <title>Registration on KITTY</title>
    <form>
        <h1>Register on KITTY</h1>
        <label for="Name">Name:</label>
        <input type="text" id="Name" name="Name"><br><br>

        <label for="Email">Email:</label>
        <input type="email" id="Email" name="Email"><br><br>
        
        <label for="Password">Password:</label>
        <input type="password" id="Password" name="Password"><br><br>

        <label for="Birthday">Birth Month:</label>
        <input type="month" id="Birthday" name="Birthday"><br><br>

        <p style="margin-bottom: 5px;">Gender:</p>
         <input type="radio" id="Male" name="Gender" value="Male">
         <label for="Male">Male</label>
         <input type="radio" id="Female" name="Gender" value="Female">
         <label for="Female">Female</label><br><br>

         <p style = "margin-bottom:5px;">Select your interests/lifestyle:</p>

            <input type = "checkbox" id="Art" name="Art" Value="Art">
            <label for ="Art">Art</label><br><br>
            <input type = "checkbox" id="Music" name="Music" Value="Music">
            <label for ="Music">Music</label><br><br>
            <input type = 'checkbox' id = 'Technology' name="Technology" Value="Technology">
            <label for ="Technology">Technology</label><br><br>

            <input type = "checkbox" id='God' name="God" value="God" required>
            <label for ='God'><i>God</i></label><br><br>

            <input type = "checkbox" id="Travel" name="Travel" Value="Travel">
            <label for ="Travel">Travel</label><br><br>
            <input type = "checkbox" id="Fitness" name="Fitness" Value="Fitness">
            <label for ="Fitness">Fitness</label><br><br>
            <input type = "checkbox" id="Cooking" name="Cooking" Value="Cooking">
            <label for ="Cooking">Cooking</label><br><br>



        <input type="Submit" value="Register">  
</head>
