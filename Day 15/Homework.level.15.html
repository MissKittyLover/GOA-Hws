<!-- 2) კომენტარების სახით ახსენით თუ რაში ვიყენებთ form, input, label, select, option, video, audio tag - ებს, კარგად გაიაზრეთ ისინი და მოიყვანეთ მაგალითებიც

formები გამოყენება ფორმების შესაქმნელად სადაც მომხმარებელს შეეძლება ინფორმაციის შეტანა ან გვერდთან ნტერაქცია (registration form, contact form, survey form, etc)
input გამოყენება რომ მომხარებელს ინფორმაცია შემოვატანინოთ (text, password, email, checkbox, radio button, etc)
labelს ვიყენებთ input tagის ასაღწერად და მომხმარებლისთვის უფრო მარტივი ხდება ფორმის შევსება
select გამოიყენება იმისთვის რომ მომხმარებელმა აირჩიოს ერთი ან მეტი ვარიანტი რაღაც მოცემული სიიდან/ჩამოსაშლელი სიიდან
option გამოიყენება რომ ვარიანტი შემოვიტანოთ რომელსაც მომხმარებელი აირჩევს.
video tag გამოიყენება ვიდეოს ჩასატვირთად და საჩვენებლად ეკრანზე
audio ефп კი გამოიყენება იმისათვის რომ ხმოვანი ჩანაწერი ავტვირთოთ და მოვასმენინოთ მომხმარებელს.


4) შექმენით მსგავსი ფორმები, drop down menu, ივარჯიშეთ video, audio tag - ებზე -->
