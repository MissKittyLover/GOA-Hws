Input tag is used to let the user enter data (text, email, password, date, etc.).
Label tag is used to define labels for input elements which improves accessibility.
Select tag is used to create a drop-down list, and option tags define the available options within the given list.
Video tag is used to embed video content on a webpage.
Audio tag is used to embed audio content on a webpage.
