3) page Layout სექციის გავლის შემდეგ, კომენტარების სახით ახსენით თუ რაში ვიყენებთ header, main, footer tag - ებს, 
მოიყვანეთ მაგალითებიც (აიღეთ თქვენი რომელიმე ძველი პროექტი და გააკეთეთ კოდის რეკონსტრუქცია ისე, 
რომ გქონდეთ გამოყენებული header, main, footer tag - ები), დაწერილი კოდი კი გაიაზრეთ და აგრეთვე ახსენით კომენტარების სახით

Header tag is a container tag in which we nest visible and much needed information about the site. On most sites, there are a few main things in this 
tag...
Site name and/or logo; a selectable list of things (menu, home page, bag, etc - aka, navigation links) and/or a search bar; The sign up/in option

Main tag is also a container tag in which we nest the main information about the site. Simplest explanation: Wikipedia.
In Wikipedia, we have the header - title, the main - whatever info is displayed (the text), the footer (optional) - extra info (links, help, about us, etc)

And with that, I explained footer too. It is at the very bottom of the site, hence the name - at least in most cases. It can sometimes be used 
in the middle of a page (at the end of a section/article) to give credits or something like that (e.g. Song lyrics followed by its author).


5) კომენტარების სახით ახსენით თუ რა არის inline block level elements, semantic და non-semantic tag - ები 
(თუ რაიმე თემა თქვენთვის უცხოა ან გაუგებარი, მოიძიეთ ინფორმაცია და შემდეგ გააკეთეთ მოცემული დავალება)

Inline block level element is a hybrid between "inline" and "block" layout behaviours. It is most commonly applied using the CSS display. This makes
the given context stay on the same line (side-by-side). Unlike other inline elements, you can give this one a specific length, width, padding, and
margin.

The semantic tags are HTML elements tgat clearly describe their meaning to both the browser and the developer.
The non-semantic tags are the opposite (almost). They are almost impossible to guess if you don't already know them. Browser reads it just fine.
