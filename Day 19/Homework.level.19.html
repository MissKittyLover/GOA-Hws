<!DOCTYPE html>

<body>
<style>
  table {width: 100%;
        border-collapse: collapse;
        text-align: center;
        background-color: solid #CC8899}
  td {border: 2px solid rgb(111, 78, 78);
     padding: 20px;
     height: 60px;}
</style>

</head>
<body>

<h2>HTML Table</h2>

<table>
  <tr>
    <td colspan="2">Cell 1</td>
    <td>Cell 2</td>
    <td>Cell 3</td>
  </tr>
  
  <tr>
    <td rowspan="3">Cell 4</td>
    <td>Cell 5</td>
    <td>Cell 6</td>
    <td>Cell 7</td>
  </tr>
  
  <tr>
    <td colspan="3">Cell 8</td>
  </tr>
  
  <tr>
    <td>Cell 9</td>
    <td colspan="2">Cell 10</td>
  </tr>
</table>

</body>
