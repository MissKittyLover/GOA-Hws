<!--2) მოიძიეთ ინფორმაცია inline, internal, external css - ის შესახებ, შემდეგ კი ახსენით განსხვავება მათ შორის კომენტარების სახით

Inline css is a way to apply css styles directly to an html element using the "style" attrubute. E.g.
<p style = 'color: #A95C68; font-size: 20px; font-family: cursive;'>

Internal css is a way to apply css styles to EVERYTHING in the html document. It is placed inside the <head> tag using the <style> element. E.g.
<head>
    <style>
        h1 {color: #722F37;
            font-size: 33px;
            font-family: cursive;}
    </style>
</head>

    3) მეორე დავალების დასრულების შემდეგ, შექმენით inline css - ის გამოყენებით მსგავსი დიზაინები -->
